[package]
name = "rewrite-eval"
description = "Deterministic fidelity and editorial evaluation harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rewrite-eval"
path = "src/main.rs"

[dependencies]
clap.workspace = true
rewrite-app = { path = "../app", version = "0.1.0" }
rewrite-inference = { path = "../inference", version = "0.1.0" }
rewrite-model = { path = "../model", version = "0.1.0" }
rewrite-types = { path = "../types", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
rewrite-inference = { path = "../inference", version = "0.1.0", features = ["test-support"] }

[lints]
workspace = true
