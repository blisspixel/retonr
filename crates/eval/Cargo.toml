[package]
name = "rewrite-eval"
description = "Deterministic fidelity and editorial evaluation harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rewrite-eval"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ctrlc.workspace = true
rewrite-app = { path = "../app", version = "0.1.0" }
rewrite-inference = { path = "../inference", version = "0.1.0" }
rewrite-model = { path = "../model", version = "0.1.0" }
rewrite-ollama = { path = "../ollama", version = "0.1.0" }
rewrite-runtime-attestor = { path = "../runtime-attestor", version = "0.1.0" }
rewrite-runtime-isolation = { path = "../runtime-isolation", version = "0.1.0" }
rewrite-types = { path = "../types", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
rewrite-inference = { path = "../inference", version = "0.1.0", features = ["test-support"] }
rewrite-model-store = { path = "../model-store", version = "0.1.0" }
rewrite-ollama-package = { path = "../ollama-package", version = "0.1.0" }
wiremock.workspace = true

[lints]
workspace = true
