[package]
name = "rewrite-runtime-attestor"
description = "Bounded native listener and process observation for local runtimes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rewrite-model = { path = "../model", version = "0.1.0" }
rewrite-types = { path = "../types", version = "0.1.0" }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["event", "net", "process"] }

[target.'cfg(windows)'.dependencies]
winx.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "deny"
unimplemented = "deny"
unwrap_used = "deny"
