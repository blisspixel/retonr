[package]
name = "rewrite-runtime-isolation"
description = "Fail-closed managed runtime network isolation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
test-support = []

[dependencies]
rewrite-types = { path = "../types", version = "0.1.0" }
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
close_fds.workspace = true
landlock.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["event", "fs", "mount", "net", "process", "runtime", "thread"] }
seccompiler.workspace = true
tar.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "rewrite-runtime-isolation-helper"
path = "src/bin/helper.rs"
