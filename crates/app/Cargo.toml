[package]
name = "rewrite-app"
description = "Application service for fidelity-gated rewriting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rewrite-engine = { path = "../engine", version = "0.1.0" }
rewrite-grounded = { path = "../grounded", version = "0.1.0" }
rewrite-inference = { path = "../inference", version = "0.1.0" }
rewrite-model = { path = "../model", version = "0.1.0" }
rewrite-model-store = { path = "../model-store", version = "0.1.0" }
rewrite-text-adapter = { path = "../text-adapter", version = "0.1.0" }
rewrite-types = { path = "../types", version = "0.1.0" }
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
rewrite-inference = { path = "../inference", version = "0.1.0", features = ["test-support"] }
serde_json.workspace = true

[lints]
workspace = true
