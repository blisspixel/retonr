[workspace]
members = [
    "crates/app",
    "crates/cli",
    "crates/engine",
    "crates/eval",
    "crates/grounded",
    "crates/inference",
    "crates/model",
    "crates/model-store",
    "crates/ollama",
    "crates/ollama-package",
    "crates/runtime-attestor",
    "crates/runtime-isolation",
    "crates/text-adapter",
    "crates/types",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/blisspixel/retonr"

[workspace.dependencies]
aho-corasick = "1.1.5"
assert_cmd = "2.2.2"
bytes = "1.12.1"
cap-fs-ext = { version = "4.0.2", default-features = false }
cap-primitives = "4.0.2"
clap = { version = "4.6.0", features = ["derive", "env"] }
clap_complete = "4.6.9"
clap_mangen = "0.2.33"
ctrlc = "3.5.2"
futures-util = "0.3.34"
fs_at = "0.2.1"
getrandom = "0.4.3"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
libc = "0.2.189"
predicates = "3.1.4"
proptest = "1.9.0"
regex = "1.11.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled", "serialize"] }
rustix = { version = "1.1.4", features = ["fs"] }
same-file = "1.0.6"
winx = "0.36.4"
windows-sys = "0.61.2"
schemars = { version = "1.0.4", features = ["derive"] }
seccompiler = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "test-util", "time"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
