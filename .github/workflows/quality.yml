name: quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository policy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check repository policy
        shell: pwsh
        run: ./scripts/check-repository.ps1

  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install documentation tools
        run: npm ci --ignore-scripts

      - name: Lint Markdown
        run: npm run lint:markdown

  workflow:
    name: workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Detect Rust workspace
        id: rust_workspace
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath Cargo.toml) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install Rust
        if: steps.rust_workspace.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Install nextest
        id: nextest
        if: steps.rust_workspace.outputs.exists == 'true'
        continue-on-error: true
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-nextest@0.9.143

      - name: Check formatting
        if: steps.rust_workspace.outputs.exists == 'true'
        run: cargo fmt --check

      - name: Check all targets and features
        if: steps.rust_workspace.outputs.exists == 'true'
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Lint all targets and features
        if: steps.rust_workspace.outputs.exists == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests with nextest
        if: >-
          steps.rust_workspace.outputs.exists == 'true' &&
          steps.nextest.outcome == 'success'
        run: cargo nextest run --locked --workspace --all-features --no-fail-fast

      - name: Run tests with Cargo fallback
        if: >-
          steps.rust_workspace.outputs.exists == 'true' &&
          steps.nextest.outcome != 'success'
        run: cargo test --locked --workspace --all-features

      - name: Run documentation tests
        if: steps.rust_workspace.outputs.exists == 'true'
        run: cargo test --locked --workspace --all-features --doc

      - name: Build documentation
        if: steps.rust_workspace.outputs.exists == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build release artifacts
        if: steps.rust_workspace.outputs.exists == 'true'
        run: cargo build --locked --workspace --all-features --release

  ollama-loopback-only:
    name: Ollama adapter in a loopback-only network namespace
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Compile Ollama adapter tests
        shell: bash
        run: |
          cargo test --locked -p rewrite-ollama --all-features --no-run
          find "$PWD/target/debug/deps" \
            -maxdepth 1 \
            -type f \
            -executable \
            \( -name 'rewrite_ollama-*' -o -name 'concurrency-*' -o -name 'proxy_environment-*' \) \
            -print > "$RUNNER_TEMP/retonr-ollama-test-binaries"
          test "$(wc -l < "$RUNNER_TEMP/retonr-ollama-test-binaries")" -eq 3

      - name: Run tests with loopback as the only network interface
        shell: bash
        run: |
          sudo env "RETONR_TEST_BINARIES=$RUNNER_TEMP/retonr-ollama-test-binaries" unshare --net bash -ceu '
            ip link set lo up
            retonr_interfaces="$(ip -o link show | cut -d: -f2 | sed -e "s/ //g" -e "s/@.*//" | sort -u)"
            test "$retonr_interfaces" = "lo"
            test -z "$(ip -4 route show table main)"
            test -z "$(ip -6 route show table main)"
            ! timeout 2 bash -c "exec 3<>/dev/tcp/192.0.2.1/9"
            while IFS= read -r retonr_test_binary; do
              "$retonr_test_binary"
            done < "$RETONR_TEST_BINARIES"
          '

  runtime-isolation-native:
    name: managed Linux native gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Compile the native isolation and attestor tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t isolation_tests < <(
            cargo test --locked -p rewrite-runtime-isolation \
              --test linux_managed --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "linux_managed" and .executable != null) | .executable'
          )
          test "${#isolation_tests[@]}" -eq 1
          test -x "${isolation_tests[0]}"
          printf '%s\n' "${isolation_tests[0]}" > "$RUNNER_TEMP/retonr-isolation-test-binary"
          mapfile -t attestor_tests < <(
            cargo test --locked -p rewrite-runtime-attestor \
              --lib --no-run --message-format=json |
              jq -r '
                select(
                  .reason == "compiler-artifact"
                  and .target.name == "rewrite_runtime_attestor"
                  and (.target.kind | index("lib"))
                  and .profile.test
                  and .executable != null
                ) | .executable
              '
          )
          test "${#attestor_tests[@]}" -eq 1
          test -x "${attestor_tests[0]}"
          printf '%s\n' "${attestor_tests[0]}" > "$RUNNER_TEMP/retonr-attestor-test-binary"

      - name: Build the admitted native isolation test environment
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag retonr-native-isolation - <<'DOCKERFILE'
          FROM ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
          RUN apt-get update \
              && DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends python3 \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE

      - name: Run the forced native isolation gate
        shell: bash
        run: |
          set -euo pipefail
          isolation_test="$(cat "$RUNNER_TEMP/retonr-isolation-test-binary")"
          docker run --rm --privileged \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --network none \
            --mount "type=bind,source=$PWD,target=$PWD" \
            --workdir "$PWD" \
            --env REWRITE_ISOLATION_REQUIRE_NATIVE=1 \
            retonr-native-isolation \
            "$isolation_test" --test-threads=1

      - name: Run the forced native attestor gate
        shell: bash
        run: |
          set -euo pipefail
          attestor_test="$(cat "$RUNNER_TEMP/retonr-attestor-test-binary")"
          expected_attestor_tests=(
            'platform::linux_managed::tests::closed_diagnostics_number_cannot_authorize_a_reused_file'
            'platform::linux_managed::tests::descriptor_substitution_flags_binding_peer_and_consumption_fail_closed'
            'platform::linux_managed::tests::expected_start_executable_namespace_uid_and_listener_are_exact'
            'platform::linux_managed::tests::fresh_diagnostics_descriptor_has_the_required_native_shape'
            'platform::linux_managed::tests::host_diagnostics_cannot_replace_a_distinct_target_namespace_when_available'
            'platform::linux_managed::tests::incomplete_managed_listener_snapshots_retry_selectively_within_the_bound'
            'platform::linux_managed::tests::managed_connection_uses_the_supplied_diagnostics_session'
            'platform::linux_managed::tests::managed_current_process_is_retained_and_reobserved'
            'platform::linux_managed::tests::visible_holder_must_be_the_exact_expected_outer_pid'
          )
          mapfile -t observed_attestor_tests < <(
            "$attestor_test" 'platform::linux_managed::tests::' --list --format terse |
              sed -n 's/: test$//p' |
              LC_ALL=C sort
          )
          test "${#observed_attestor_tests[@]}" -eq "${#expected_attestor_tests[@]}"
          for index in "${!expected_attestor_tests[@]}"; do
            test "${observed_attestor_tests[$index]}" = "${expected_attestor_tests[$index]}"
          done
          docker run --rm \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=$PWD" \
            --workdir "$PWD" \
            --env REWRITE_ATTESTOR_REQUIRE_NATIVE=1 \
            retonr-native-isolation \
            "$attestor_test" 'platform::linux_managed::tests::' --test-threads=1

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Detect Rust workspace
        id: rust_workspace
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath Cargo.toml) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install Rust
        if: steps.rust_workspace.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Install coverage tooling
        if: steps.rust_workspace.outputs.exists == 'true'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Build the admitted native isolation test environment
        if: steps.rust_workspace.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag retonr-native-isolation - <<'DOCKERFILE'
          FROM ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
          RUN apt-get update \
              && DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends python3 \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE

      - name: Enforce coverage floor
        if: steps.rust_workspace.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          eval "$(cargo llvm-cov show-env --sh)"
          test "${LLVM_PROFILE_FILE#/}" != "$LLVM_PROFILE_FILE"
          mkdir -p "$(dirname "$LLVM_PROFILE_FILE")"
          mapfile -t isolation_tests < <(
            cargo test --locked -p rewrite-runtime-isolation \
              --test linux_managed --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "linux_managed" and .executable != null) | .executable'
          )
          test "${#isolation_tests[@]}" -eq 1
          test -x "${isolation_tests[0]}"
          mapfile -t attestor_tests < <(
            cargo test --locked -p rewrite-runtime-attestor \
              --lib --no-run --message-format=json |
              jq -r '
                select(
                  .reason == "compiler-artifact"
                  and .target.name == "rewrite_runtime_attestor"
                  and (.target.kind | index("lib"))
                  and .profile.test
                  and .executable != null
                ) | .executable
              '
          )
          test "${#attestor_tests[@]}" -eq 1
          test -x "${attestor_tests[0]}"
          expected_attestor_tests=(
            'platform::linux_managed::tests::closed_diagnostics_number_cannot_authorize_a_reused_file'
            'platform::linux_managed::tests::descriptor_substitution_flags_binding_peer_and_consumption_fail_closed'
            'platform::linux_managed::tests::expected_start_executable_namespace_uid_and_listener_are_exact'
            'platform::linux_managed::tests::fresh_diagnostics_descriptor_has_the_required_native_shape'
            'platform::linux_managed::tests::host_diagnostics_cannot_replace_a_distinct_target_namespace_when_available'
            'platform::linux_managed::tests::incomplete_managed_listener_snapshots_retry_selectively_within_the_bound'
            'platform::linux_managed::tests::managed_connection_uses_the_supplied_diagnostics_session'
            'platform::linux_managed::tests::managed_current_process_is_retained_and_reobserved'
            'platform::linux_managed::tests::visible_holder_must_be_the_exact_expected_outer_pid'
          )
          mapfile -t observed_attestor_tests < <(
            "${attestor_tests[0]}" 'platform::linux_managed::tests::' --list --format terse |
              sed -n 's/: test$//p' |
              LC_ALL=C sort
          )
          test "${#observed_attestor_tests[@]}" -eq "${#expected_attestor_tests[@]}"
          for index in "${!expected_attestor_tests[@]}"; do
            test "${observed_attestor_tests[$index]}" = "${expected_attestor_tests[$index]}"
          done
          cargo test --locked --workspace --all-targets --all-features
          profile_dir="$(dirname "$LLVM_PROFILE_FILE")"
          native_dir="$profile_dir/native"
          mkdir -p "$native_dir"
          native_profile="$native_dir/native-%p-%m.profraw"
          docker run --rm \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=$PWD" \
            --workdir "$PWD" \
            --env CARGO_LLVM_COV=1 \
            --env LLVM_PROFILE_FILE="$native_profile" \
            --env REWRITE_ATTESTOR_REQUIRE_NATIVE=1 \
            retonr-native-isolation \
            "${attestor_tests[0]}" 'platform::linux_managed::tests::' --test-threads=1
          docker run --rm --privileged \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --network none \
            --mount "type=bind,source=$PWD,target=$PWD" \
            --workdir "$PWD" \
            --env CARGO_LLVM_COV=1 \
            --env LLVM_PROFILE_FILE="$native_profile" \
            --env REWRITE_ISOLATION_REQUIRE_NATIVE=1 \
            retonr-native-isolation \
            "${isolation_tests[0]}" --test-threads=1
          profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | awk '/^host:/{print $2}')/bin/llvm-profdata"
          valid_native_profiles=0
          invalid_native_profiles=0
          while IFS= read -r -d '' profile; do
            if "$profdata" merge -sparse "$profile" -o "$native_dir/check.profdata"; then
              cp "$profile" "$profile_dir/"
              valid_native_profiles=$((valid_native_profiles + 1))
            else
              rm -f "$profile"
              invalid_native_profiles=$((invalid_native_profiles + 1))
            fi
          done < <(find "$native_dir" -name '*.profraw' -print0)
          rm -f "$native_dir/check.profdata"
          test "$valid_native_profiles" -gt 0
          printf 'native coverage profiles: %s valid, %s discarded\n' \
            "$valid_native_profiles" "$invalid_native_profiles"
          cargo llvm-cov report --fail-under-lines 80

  fuzz-smoke:
    name: fuzz target smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-08-01

      - name: Install fuzz tooling
        id: fuzz_tooling
        continue-on-error: true
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-fuzz@0.13.2

      - name: Install fuzz tooling from source fallback
        if: steps.fuzz_tooling.outcome != 'success'
        run: >-
          cargo +nightly install cargo-fuzz
          --version 0.13.2 --locked

      - name: Validate fuzz lockfile
        run: >-
          cargo metadata --manifest-path fuzz/Cargo.toml
          --locked --format-version 1

      - name: Build fuzz targets
        run: >-
          cargo +nightly fuzz build
          --target x86_64-unknown-linux-gnu

      - name: Smoke test protection round trips
        run: >-
          cargo +nightly fuzz run
          --target x86_64-unknown-linux-gnu
          protection_roundtrip --
          -max_total_time=15

      - name: Smoke test text adapter identity
        run: >-
          cargo +nightly fuzz run
          --target x86_64-unknown-linux-gnu
          text_adapter_identity --
          -max_total_time=15

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Detect Rust lockfile and policy
        id: rust_policy
        shell: pwsh
        run: |
          if ((Test-Path -LiteralPath Cargo.lock) -and
              (Test-Path -LiteralPath deny.toml)) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install Rust
        if: steps.rust_policy.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Install dependency policy tool
        if: steps.rust_policy.outputs.exists == 'true'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-deny@0.20.2

      - name: Install advisory audit tool
        if: steps.rust_policy.outputs.exists == 'true'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-audit@0.22.2

      - name: Check dependency and license policy
        if: steps.rust_policy.outputs.exists == 'true'
        run: cargo deny check

      - name: Check RustSec advisories
        if: steps.rust_policy.outputs.exists == 'true'
        run: cargo audit

  required:
    name: required
    if: ${{ always() }}
    needs:
      - repository-policy
      - markdown
      - workflow
      - rust
      - ollama-loopback-only
      - runtime-isolation-native
      - coverage
      - fuzz-smoke
      - supply-chain
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job passed
        env:
          RETONR_REQUIRED_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: >-
          jq -e
          'all(.[]; .result == "success")'
          <<<"$RETONR_REQUIRED_RESULTS"
